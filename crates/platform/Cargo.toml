[package]
name = "postino-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Platform seams: the OS keyring, and the store key Postino keeps in it"

[dependencies]
directories.workspace = true
fs4.workspace = true
getrandom.workspace = true
keyring-core.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store.workspace = true
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
# One minimal Win32 adapter is allowed: the tray, balloon notices and registry Run key in
# `src/win32.rs`. Everything else in this crate is safe. `#![allow(unsafe_code)]` is scoped there.
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
