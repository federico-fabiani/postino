[package]
name = "postino-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Same-user local transport for the Postino daemon: JSON-RPC 2.0 over a named pipe or Unix socket"

[dependencies]
blake3.workspace = true
getrandom.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
# One minimal platform adapter is allowed: the Windows ACL/SID calls below. Everything else in this
# crate is safe. `#![allow(unsafe_code)]` is scoped to the platforms module.
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
