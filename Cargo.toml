[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/postino-app", "apps/postino-cli", "apps/postino-daemon", "xtask"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/federico-fabiani/postino"

[workspace.dependencies]
# internal
postino-core = { path = "crates/core", version = "0.1.0" }
postino-crypto = { path = "crates/crypto", version = "0.1.0" }
postino-daemon = { path = "apps/postino-daemon", version = "0.1.0" }
postino-ipc = { path = "crates/ipc", version = "0.1.0" }
postino-mime = { path = "crates/mime", version = "0.1.0" }
postino-net = { path = "crates/net", version = "0.1.0" }
postino-platform = { path = "crates/platform", version = "0.1.0" }
postino-store = { path = "crates/store", version = "0.1.0" }
postino-sync = { path = "crates/sync", version = "0.1.0" }
postino-testkit = { path = "crates/testkit", version = "0.1.0" }

# foundation
mail-parser = { version = "=1.0.0", features = ["full_encoding"] }
# OpenPGP key parsing and passphrase checks (P12c1). Pure Rust, MIT OR Apache-2.0; the bzip2
# default feature is off because Postino never decompresses OpenPGP compressed data.
pgp = { version = "=0.21.0", default-features = false }
rand = "0.8.6"
ammonia = "=4.2.4"
# Parse-only calendar support for received invites (P12d). The parser feature is the only one
# enabled: no recurrence expansion and no timezone database, both deliberate product limits.
icalendar = { version = "=0.17.17", default-features = false, features = ["parser"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
directories = "6"
fs4 = { version = "0.13", features = ["sync"] }
anyhow = "1"
getrandom = { version = "0.3", features = ["std"] }
zeroize = "1"

# network
tokio = { version = "=1.53.3", features = ["rt", "rt-multi-thread", "net", "time", "io-util", "macros", "sync"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["logging", "tls12", "ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
base64 = "=0.22.1"
# The release feed (crates/net/src/release.rs). No bundled root list: trust roots come from the
# operating system, because webpki-roots and webpki-root-certs are CDLA-licensed.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring"] }
rustls-native-certs = "0.8"

# network tests
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }

# keyring
keyring-core = "1"
windows-native-keyring-store = "1"

# store
rusqlite = { version = "0.41", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }

# cli
clap = { version = "4.6", features = ["derive"] }
rpassword = "7"

# ui
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.36", default-features = false }
egui-phosphor = { version = "0.14", features = ["fill"] }
png = "0.18"

# build tooling
cargo_metadata = "0.23"
toml = "0.9"

# cryptography and blob storage. chacha20poly1305 0.10.1, hkdf 0.12.4 and sha2 0.10.9 share the
# crypto-common 0.1 / digest 0.10 generation already in the lockfile, so the sealed-blob layer adds
# one AEAD stack, not a second copy of the hashing traits.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
hkdf = "=0.12.4"
sha2 = "=0.10.9"
blake3 = "=1.8.7"
zstd = "=0.14.3"

# daemon IPC. Both crates are already in the lockfile: libc arrives with the keyring stack,
# windows-sys with windows-native-keyring-store. See docs/decisions/0005-daemon-dependencies.md.
libc = "0.2"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# test-only
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
