[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/postino-app", "apps/postino-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/federicopostino/postino"

[workspace.dependencies]
# internal
postino-core = { path = "crates/core", version = "0.1.0" }
postino-mime = { path = "crates/mime", version = "0.1.0" }
postino-platform = { path = "crates/platform", version = "0.1.0" }
postino-store = { path = "crates/store", version = "0.1.0" }

# foundation
mail-parser = { version = "=1.0.0", features = ["full_encoding"] }
ammonia = "=4.2.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
directories = "6"
fs4 = { version = "0.13", features = ["sync"] }
anyhow = "1"
getrandom = { version = "0.3", features = ["std"] }
zeroize = "1"

# keyring
keyring-core = "1"
windows-native-keyring-store = "1"

# store
rusqlite = { version = "0.41", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }

# cli
clap = { version = "4.6", features = ["derive"] }

# ui
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.36", default-features = false }
egui-phosphor = { version = "0.14", features = ["fill"] }
png = "0.18"

# build tooling
cargo_metadata = "0.23"
toml = "0.9"
sha2 = "0.10"

# test-only
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
